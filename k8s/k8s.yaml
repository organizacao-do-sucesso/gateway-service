apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: store
data:
  CORS_ALLOWED_CREDENTIALS: "true"
  CORS_ALLOWED_ORIGINS: "http://localhost:8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: store/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gateway-config
          startupProbe:
            httpGet:
              path: /health-check
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health-check
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health-check
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: store
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
