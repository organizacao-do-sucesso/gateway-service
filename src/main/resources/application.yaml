spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:

          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: ${CORS_ALLOWED_ORIGINS}
                allowedHeaders: "*"
                allowedMethods: "*"
                allowCredentials: ${CORS_ALLOWED_CREDENTIALS}

          routes:

            - id: insper
              uri: https://www.insper.edu.br
              predicates:
                - Path=/insper/**

            - id: accounts
              uri: http://account:8080
              predicates:
                - Path=/accounts/**

            - id: auth
              uri: http://auth:8080
              predicates:
                - Path=/auth/**

            - id: products
              uri: http://product:8080
              predicates:
                - Path=/products/**

            - id: orders
              uri: http://order:8080
              predicates:
                - Path=/orders/**

            - id: exchanges
              uri: http://exchange:8000
              predicates:
                - Path=/exchanges/**

            # observability (organizacao-do-sucesso/observability), served under these sub-paths
            - id: grafana
              uri: http://grafana:3000
              predicates:
                - Path=/grafana/**

            - id: prometheus
              uri: http://prometheus:9090
              predicates:
                - Path=/prometheus/**

logging:
  level:
    root: info
    store: debug
    org.springframework.web: debug